[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dog-breed-classifier"
version = "1.0.0"
description = "ResNet50 犬种分类：从数据清洗到 CPU 上 2.6ms 的 INT8 服务"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zw" }]
keywords = ["pytorch", "onnx", "fastapi", "quantization", "computer-vision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 这里是「服务最小依赖」。装了它就能跑 HTTP 服务，不需要 torch。
# 训练 / 评估 / 导出需要的重依赖见 requirements-train.txt
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "onnxruntime>=1.18",
    "pillow>=10.0",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
train = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "onnx>=1.15",
]

[project.scripts]
dogbreed-export = "models.export:main"

[tool.setuptools]
# src 布局：src/ 下的每个子目录都是顶层包名（data / models / train / eval / serve / common）
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["static/*.html"]
